    <!-- Script optionnel pour basculer entre étudiant/propriétaire -->
    <script>
        const student = document.getElementById('student');
        const owner = document.getElementById('owner');
        const ecoleField = document.getElementById('ecole-field');
        const telephoneField = document.getElementById('telephone-field');
        
        student.addEventListener('change', function() {
            if(this.checked) {
                ecoleField.style.display = 'block';
                telephoneField.style.display = 'none';
            }
        });
        
        owner.addEventListener('change', function() {
            if(this.checked) {
                ecoleField.style.display = 'none';
                telephoneField.style.display = 'block';
            }
        });
    </script>

   public function checkEmail(): void
   {
       header('Content-Type: application/json');
       
       if (!$this->isPost()) {
           echo json_encode(['exists' => false]);
           return;
       }
       
       $email = $this->post('email');
       
       if (empty($email)) {
           echo json_encode(['exists' => false]);
           return;
       }
       
       $utilisateurModel = $this->model('Utilisateur');
       $exists = $utilisateurModel->emailExists($email);
       
       echo json_encode(['exists' => $exists]);
   }

3. VALIDATION DANS LA MÉTHODE REGISTER
   
   public function register(): void
   {
       // ... récupération des données POST ...
       
       $utilisateurModel = $this->model('Utilisateur');
       $errors = [];
       
       // Validation du nom
       $nomValidation = $utilisateurModel->validateName($nom, 'Nom');
       if (!$nomValidation['valid']) {
           $errors = array_merge($errors, $nomValidation['errors']);
       }
       
       // Validation du prénom
       $prenomValidation = $utilisateurModel->validateName($prenom, 'Prénom');
       if (!$prenomValidation['valid']) {
           $errors = array_merge($errors, $prenomValidation['errors']);
       }
       
       // Validation de l'email
       $emailValidation = $utilisateurModel->validateEmail($email);
       if (!$emailValidation['valid']) {
           $errors = array_merge($errors, $emailValidation['errors']);
       } else {
           // Vérifier si l'email existe déjà
           if ($utilisateurModel->emailExists($email)) {
               $errors[] = 'Cet email est déjà utilisé.';
           }
       }
       
       // Validation du mot de passe
       if (empty($password)) {
           $errors[] = 'Le mot de passe est obligatoire.';
       } else {
           $passwordValidation = $utilisateurModel->validatePassword($password);
           if (!$passwordValidation['valid']) {
               $errors = array_merge($errors, $passwordValidation['errors']);
           }
       }
       
       // Si erreurs, retour au formulaire
       if (!empty($errors)) {
           $this->setFlash('error', implode('<br>', $errors));
           $this->redirect('register');
           return;
       }
       
       // ... suite du traitement ...
   }

MÉTHODES DE VALIDATION DANS LE MODÈLE (Utilisateur.php)
═══════════════════════════════════════════════════════════════

public function validatePassword(string $password): array
{
    $errors = [];
    
    if (strlen($password) < 8) {
        $errors[] = 'Le mot de passe doit contenir au moins 8 caractères';
    }
    
    if (strlen($password) > 100) {
        $errors[] = 'Le mot de passe ne peut pas dépasser 100 caractères';
    }
    
    if (!preg_match('/[A-Z]/', $password)) {
        $errors[] = 'Le mot de passe doit contenir au moins une lettre majuscule';
    }
    
    if (!preg_match('/[a-z]/', $password)) {
        $errors[] = 'Le mot de passe doit contenir au moins une lettre minuscule';
    }
    
    if (!preg_match('/[0-9]/', $password)) {
        $errors[] = 'Le mot de passe doit contenir au moins un chiffre';
    }
    
    if (!preg_match('/[!@#$%^&*()\[\]{}\-_=+\\|;:\'",.<>?\/`~]/', $password)) {
        $errors[] = 'Le mot de passe doit contenir au moins un caractère spécial';
    }
    
    return [
        'valid' => empty($errors),
        'errors' => $errors
    ];
}

public function validateName(string $name, string $fieldName = 'Nom'): array
{
    $errors = [];
    $name = trim($name);
    
    if (empty($name)) {
        $errors[] = "$fieldName est obligatoire";
    } elseif (strlen($name) < 2) {
        $errors[] = "$fieldName doit contenir au moins 2 caractères";
    } elseif (strlen($name) > 50) {
        $errors[] = "$fieldName ne peut pas dépasser 50 caractères";
    } elseif (!preg_match('/^[a-zA-ZÀ-ÿ\s\'-]+$/u', $name)) {
        $errors[] = "$fieldName ne peut contenir que des lettres";
    }
    
    return [
        'valid' => empty($errors),
        'errors' => $errors
    ];
}

public function validateEmail(string $email): array
{
    $errors = [];
    $email = trim($email);
    
    if (empty($email)) {
        $errors[] = 'Email est obligatoire';
    } elseif (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
        $errors[] = 'Format d\'email invalide';
    } elseif (strlen($email) > 100) {
        $errors[] = 'Email trop long (maximum 100 caractères)';
    }
    
    return [
        'valid' => empty($errors),
        'errors' => $errors
    ];
}

public function validatePhone(string $phone): array
{
    $errors = [];
    $phone = preg_replace('/\s+/', '', $phone);
    
    if (empty($phone)) {
        $errors[] = 'Téléphone est obligatoire';
    } elseif (!preg_match('/^(?:(?:\+|00)33|0)[1-9](?:[0-9]{8})$/', $phone)) {
        $errors[] = 'Format de téléphone invalide';
    }
    
    return [
        'valid' => empty($errors),
        'errors' => $errors
    ];
}
